name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-public-tree.py
      - run: go test -race ./... -count=1 -timeout=60s
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/quasar-bridge ./cmd/quasar-bridge
      - run: python3 scripts/test-yap.py
      - run: sh -n packaging/yam/start.sh packaging/yam/control.sh packaging/yam/S98quasar-yam
      - run: python3 scripts/build-yap.py
